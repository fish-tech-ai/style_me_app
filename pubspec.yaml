name: style_me
description: "Style me project."
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  path: ^1.9.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  collection: ^1.19.0
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  flutter_native_splash: ^2.4.4
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  connectivity_plus: ^6.1.2
  internet_connection_checker: ^3.0.1
  go_router: ^18.0.1
  json_annotation: ^4.9.0
  chopper: ^8.0.3
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: ^3.0.0
  convert: ^3.1.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.3.5
  freezed_annotation: ^3.1.0
  logging: ^1.3.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.5
  firebase_core: ^4.14.0
  app_links: ^7.2.1
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  google_sign_in_ios: ^6.3.3
  shimmer: ^4.0.0
  encrypt: ^5.0.3
  pointycastle: ^3.6.2
  image: ^4.5.3
  camera: ^0.12.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  isolate_manager: ^6.0.0
  smooth_page_indicator: ^3.0.0
  markdown_widget: ^2.3.2+8
  gal: ^2.3.1
  app_settings: ^9.0.0
  android_gesture_exclusion: ^0.4.0
  pasteboard: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  riverpod_lint: ^3.1.9
  json_serializable: ^6.14.1
  freezed: ^4.0.1
  chopper_generator: ^8.7.0
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.8.1
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/app_icon.png"
  adaptive_icon_foreground: "assets/launcher/app_icon.png"
  adaptive_icon_background: "#7B4DB2"
  adaptive_icon_foreground_inset: 24
  remove_alpha_ios: true

flutter_native_splash:
  image: "assets/launcher/app_icon_splash.png"
  color: "#1f142b"
  android_gravity: center
  ios_content_mode: center
  android_12:
    image: "assets/launcher/app_icon_splash.png"
    color: "#1f142b"

flutter:
  generate: true
  assets:
    - assets/
    - assets/bottom_nav_icons/
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Thin.ttf
          weight: 100
        - asset: assets/fonts/Inter-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
        - asset: assets/fonts/italic/Inter-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/italic/Inter-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/italic/Inter-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/italic/Inter-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/italic/Inter-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/italic/Inter-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/italic/Inter-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/italic/Inter-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/italic/Inter-BlackItalic.ttf
          weight: 900
          style: italic
  uses-material-design: true

